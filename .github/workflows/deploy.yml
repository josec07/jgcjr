name: Deploy site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing secret CLOUDFLARE_API_TOKEN."
            echo "Repo Settings, Secrets and variables, Actions, New repository secret."
            exit 1
          fi

      - name: Stage site files
        run: |
          mkdir -p out
          cp index.html demo.gif bmount-bg.jpg out/

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4b810459c083780a716cb7e709962ede
          command: pages deploy out --project-name=jgcjr
